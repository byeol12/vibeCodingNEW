<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8066e8" />
    <title>오프라인 · 도장 스트릭</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(155deg, #fffaf0 0%, #f8f3ff 48%, #f3fff9 100%);
        color: #3d3158;
      }
      main {
        max-width: 28rem;
        text-align: center;
        border: 2px solid #e8ddf4;
        border-radius: 28px;
        background: #fffefd;
        padding: 28px 24px;
        box-shadow: 0 12px 0 rgb(98 72 161 / 8%);
      }
      h1 {
        margin: 0 0 10px;
        font-family: Jua, "Apple SD Gothic Neo", sans-serif;
        font-size: 1.8rem;
        font-weight: 400;
      }
      p {
        margin: 0 0 18px;
        line-height: 1.7;
        color: #756b86;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        background: #8066e8;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>잠시 오프라인이에요</h1>
      <p>
        네트워크에 다시 연결되면 학생 홈과 수업 방을 이어서 사용할 수 있어요.
        캐시된 화면이 있으면 그대로 열 수 있습니다.
      </p>
      <a href="/">다시 시도</a>
    </main>
  </body>
</html>
